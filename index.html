<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Bee Competition</title>
    <!-- PWA Meta tags for Offline Capability -->
    <meta name="theme-color" content="#60a5fa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" id="manifest-link">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        /* Base & Variables */
        :root {
            --sky-top: #60a5fa;
            --sky-bottom: #bae6fd;
            --hill-light: #86efac;
            --hill-dark: #4ade80;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden; /* Keep it contained */
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
        }

        h1, h2, h3, .font-heading {
            font-family: 'Fredoka One', cursive;
        }

        /* --- Animated Backdrop Elements --- */
        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Clouds */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            opacity: 0.9;
            animation: drift linear infinite;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud-1 { width: 120px; height: 40px; top: 10%; left: -150px; animation-duration: 40s; }
        .cloud-1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
        .cloud-1::after { width: 40px; height: 40px; top: -20px; left: 65px; }
        
        .cloud-2 { width: 160px; height: 50px; top: 25%; left: -200px; animation-duration: 55s; animation-delay: 15s; }
        .cloud-2::before { width: 80px; height: 80px; top: -40px; left: 25px; }
        .cloud-2::after { width: 60px; height: 60px; top: -25px; left: 85px; }

        @keyframes drift {
            from { transform: translateX(-200px); }
            to { transform: translateX(110vw); }
        }

        /* Hills */
        .hills {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
        }
        .hill-bg {
            position: absolute;
            bottom: 0;
            left: -10%;
            width: 120%;
            height: 100%;
            background: var(--hill-dark);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            transform: scaleY(0.7);
            transform-origin: bottom;
        }
        .hill-fg {
            position: absolute;
            bottom: -5%;
            left: -5%;
            width: 110%;
            height: 80%;
            background: var(--hill-light);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            box-shadow: inset 0 20px 0 rgba(255,255,255,0.2);
        }

        /* Bees */
        .bee-container {
            position: absolute;
            animation: floatBee 15s ease-in-out infinite alternate;
        }
        .bee-1 { top: 30%; left: 15%; animation-duration: 20s; }
        .bee-2 { top: 50%; right: 20%; animation-duration: 18s; animation-delay: -5s; }
        
        .bee-wing {
            transform-origin: bottom center;
            animation: flutter 0.1s infinite alternate;
        }
        
        @keyframes flutter {
            from { transform: rotate(0deg) scaleY(1); }
            to { transform: rotate(20deg) scaleY(0.5); }
        }
        @keyframes floatBee {
            0% { transform: translate(0, 0) rotate(-5deg); }
            33% { transform: translate(50px, -30px) rotate(5deg); }
            66% { transform: translate(-20px, 40px) rotate(-10deg); }
            100% { transform: translate(100px, -10px) rotate(15deg); }
        }

        /* Books */
        .giant-book {
            position: absolute;
            bottom: -20px;
            width: 250px;
            height: auto;
        }
        .book-left { left: 2%; transform: rotate(10deg); }
        .book-right { right: 2%; transform: rotate(-15deg); }

        /* 3D Blocks */
        .blocks-container {
            position: absolute;
            bottom: 50px;
            display: flex;
            gap: 15px;
        }
        .blocks-left { left: 15%; }
        .blocks-right { right: 15%; }
        
        .block-3d {
            width: 60px;
            height: 60px;
            position: relative;
            transform-style: preserve-3d;
            animation: bob 4s infinite alternate ease-in-out;
        }
        .block-3d.b1 { animation-delay: 0s; transform: rotateX(-15deg) rotateY(25deg); }
        .block-3d.b2 { animation-delay: 1s; transform: rotateX(-10deg) rotateY(-20deg); }
        .block-3d.b3 { animation-delay: 2s; transform: rotateX(-20deg) rotateY(15deg); }

        @keyframes bob {
            from { margin-top: 0; }
            to { margin-top: -15px; }
        }

        .block-face {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #fff;
            border: 4px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            font-family: 'Fredoka One', cursive;
        }
        /* A simple CSS cube setup */
        .block-face.front  { transform: translateZ(30px); background: #fca5a5; color: white;}
        .block-face.back   { transform: rotateY(180deg) translateZ(30px); }
        .block-face.right  { transform: rotateY(90deg) translateZ(30px); background: #f87171; }
        .block-face.left   { transform: rotateY(-90deg) translateZ(30px); }
        .block-face.top    { transform: rotateX(90deg) translateZ(30px); background: #fecaca; }
        .block-face.bottom { transform: rotateX(-90deg) translateZ(30px); }

        .block-3d.b2 .block-face.front { background: #93c5fd; }
        .block-3d.b2 .block-face.right { background: #60a5fa; }
        .block-3d.b2 .block-face.top { background: #bfdbfe; }
        
        .block-3d.b3 .block-face.front { background: #fde047; }
        .block-3d.b3 .block-face.right { background: #facc15; }
        .block-3d.b3 .block-face.top { background: #fef08a; }

        /* --- UI & Interaction --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Allow scrolling if content gets too tall on small screens */
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 2rem;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* Buttons */
        .btn {
            background-color: #f59e0b; /* Amber 500 */
            color: white;
            border: 4px solid #b45309; /* Amber 700 */
            border-radius: 9999px;
            padding: 1rem 2.5rem;
            font-size: 1.5rem;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            box-shadow: 0 8px 0 #b45309, 0 15px 20px rgba(0,0,0,0.2);
            transition: all 0.1s;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }
        .btn:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 #b45309, 0 5px 10px rgba(0,0,0,0.2);
        }
        .btn-blue {
            background-color: #3b82f6;
            border-color: #1d4ed8;
            box-shadow: 0 8px 0 #1d4ed8, 0 15px 20px rgba(0,0,0,0.2);
        }
        .btn-blue:active {
            box-shadow: 0 0px 0 #1d4ed8, 0 5px 10px rgba(0,0,0,0.2);
        }
        .btn-green {
            background-color: #10b981;
            border-color: #047857;
            box-shadow: 0 8px 0 #047857, 0 15px 20px rgba(0,0,0,0.2);
        }
        .btn-green:active {
            box-shadow: 0 0px 0 #047857, 0 5px 10px rgba(0,0,0,0.2);
        }
        .btn-small {
            padding: 0.5rem 1.5rem;
            font-size: 1.25rem;
            border-width: 3px;
            box-shadow: 0 5px 0 inherit, 0 10px 15px rgba(0,0,0,0.2);
        }

        /* Flip Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
            max-width: 1200px;
            width: 100%;
            margin-top: 1rem;
            perspective: 1000px;
        }
        @media(max-width: 768px){
            .cards-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 0.5rem; }
        }

        .flip-card {
            background: transparent;
            width: 100%;
            aspect-ratio: 4/3;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Safari */
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 4px solid white;
            overflow: hidden;
        }

        .flip-card-front {
            background: linear-gradient(135deg, #fcd34d, #f59e0b);
            color: white;
            font-size: 2.5rem;
            font-family: 'Fredoka One', cursive;
            text-shadow: 2px 2px 0 #b45309;
        }
        .flip-card-front::after {
            content: '';
            position: absolute;
            top: 5%; left: 5%; right: 5%; bottom: 5%;
            border: 3px dashed rgba(255,255,255,0.5);
            border-radius: 8px;
            pointer-events: none;
        }

        .flip-card-back {
            background-color: white;
            transform: rotateY(180deg);
            padding: 5px;
        }

        .flip-card-back img {
            width: 100%;
            height: 70px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 5px;
        }

        .flip-card-back .word-reveal {
            font-size: 1rem;
            font-weight: bold;
            color: #1e3a8a;
            opacity: 0;
            transition: opacity 0.3s;
            margin-bottom: 5px;
        }
        .flip-card-back.revealed .word-reveal {
            opacity: 1;
        }

        /* Timer */
        .timer-display {
            font-family: 'Fredoka One', cursive;
            font-size: 4rem;
            color: #ef4444;
            text-shadow: 3px 3px 0 white, -3px -3px 0 white, 3px -3px 0 white, -3px 3px 0 white;
            background: rgba(255,255,255,0.7);
            padding: 0.5rem 2rem;
            border-radius: 9999px;
            border: 4px solid #ef4444;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            transition: color 0.3s, transform 0.1s;
        }
        .timer-display.low {
            color: #991b1b;
            animation: pulse-fast 0.5s infinite;
        }

        @keyframes pulse-fast {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Modal Settings */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-content {
            background: white;
            border-radius: 24px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 6px solid #60a5fa;
        }

        /* Custom Scrollbar for Settings */
        .modal-content::-webkit-scrollbar { width: 8px; }
        .modal-content::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px;}
        .modal-content::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 4px; }
        .modal-content::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        @media(max-width: 640px) {
            .settings-grid { grid-template-columns: 1fr; }
        }

        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 0.25rem; color: #4b5563; }
        .input-group input { 
            width: 100%; padding: 0.5rem; 
            border: 2px solid #d1d5db; border-radius: 8px; 
            transition: border-color 0.2s;
        }
        .input-group input:focus { outline: none; border-color: #3b82f6; }

        /* Notification */
        #notification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.25rem;
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
            z-index: 100;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notification.show { top: 20px; }

        /* Presentation Mode Overrides */
        #presentation-card.flipped {
            transform: rotateY(180deg);
        }
        .revealed-word {
            opacity: 1 !important;
        }

    </style>
</head>
<body>

    <!-- 1. Animated Backdrop (Pure CSS/SVG) -->
    <div class="backdrop">
        <!-- Clouds -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        
        <!-- Flying Bees -->
        <div class="bee-container bee-1">
            <svg width="60" height="60" viewBox="0 0 100 100">
                <!-- Body -->
                <ellipse cx="50" cy="50" rx="35" ry="25" fill="#fbbf24" stroke="#000" stroke-width="4"/>
                <!-- Stripes -->
                <path d="M 35 27 L 35 73 M 50 25 L 50 75 M 65 27 L 65 73" stroke="#000" stroke-width="6" stroke-linecap="round"/>
                <!-- Eye -->
                <circle cx="75" cy="45" r="4" fill="#000" />
                <circle cx="76" cy="44" r="1.5" fill="#fff" />
                <!-- Smile -->
                <path d="M 70 55 Q 75 60 80 55" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                <!-- Stinger -->
                <path d="M 15 50 L 5 48 L 14 55 Z" fill="#000" />
                <!-- Wings -->
                <ellipse cx="45" cy="20" rx="12" ry="25" fill="rgba(255,255,255,0.9)" stroke="#cbd5e1" stroke-width="2" class="bee-wing" />
                <ellipse cx="60" cy="25" rx="10" ry="20" fill="rgba(255,255,255,0.9)" stroke="#cbd5e1" stroke-width="2" class="bee-wing" style="animation-delay: 0.05s" />
            </svg>
        </div>

        <div class="bee-container bee-2" style="transform: scale(0.7)">
            <svg width="60" height="60" viewBox="0 0 100 100">
                <ellipse cx="50" cy="50" rx="35" ry="25" fill="#fbbf24" stroke="#000" stroke-width="4"/>
                <path d="M 35 27 L 35 73 M 50 25 L 50 75 M 65 27 L 65 73" stroke="#000" stroke-width="6" stroke-linecap="round"/>
                <circle cx="75" cy="45" r="4" fill="#000" />
                <circle cx="76" cy="44" r="1.5" fill="#fff" />
                <path d="M 70 55 Q 75 60 80 55" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M 15 50 L 5 48 L 14 55 Z" fill="#000" />
                <ellipse cx="45" cy="20" rx="12" ry="25" fill="rgba(255,255,255,0.9)" stroke="#cbd5e1" stroke-width="2" class="bee-wing" />
                <ellipse cx="60" cy="25" rx="10" ry="20" fill="rgba(255,255,255,0.9)" stroke="#cbd5e1" stroke-width="2" class="bee-wing" style="animation-delay: 0.05s" />
            </svg>
        </div>

        <!-- Hills -->
        <div class="hills">
            <div class="hill-bg"></div>
            <div class="hill-fg"></div>
        </div>

        <!-- Giant Open Books -->
        <div class="giant-book book-left">
            <svg viewBox="0 0 200 100" width="100%" height="100%">
                <path d="M 100 90 Q 50 110 10 90 L 10 20 Q 50 40 100 20 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="4" />
                <path d="M 100 90 Q 150 110 190 90 L 190 20 Q 150 40 100 20 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="4" />
                <path d="M 100 20 L 100 90" stroke="#94a3b8" stroke-width="4" />
                <!-- Pages lines -->
                <path d="M 20 35 Q 50 50 90 35" stroke="#cbd5e1" stroke-width="2" fill="none" />
                <path d="M 20 50 Q 50 65 90 50" stroke="#cbd5e1" stroke-width="2" fill="none" />
                <path d="M 180 35 Q 150 50 110 35" stroke="#cbd5e1" stroke-width="2" fill="none" />
                <path d="M 180 50 Q 150 65 110 50" stroke="#cbd5e1" stroke-width="2" fill="none" />
            </svg>
        </div>
        <div class="giant-book book-right">
            <svg viewBox="0 0 200 100" width="100%" height="100%">
                <path d="M 100 90 Q 50 110 10 90 L 10 20 Q 50 40 100 20 Z" fill="#fef2f2" stroke="#fca5a5" stroke-width="4" />
                <path d="M 100 90 Q 150 110 190 90 L 190 20 Q 150 40 100 20 Z" fill="#fee2e2" stroke="#fca5a5" stroke-width="4" />
                <path d="M 100 20 L 100 90" stroke="#fca5a5" stroke-width="4" />
                <path d="M 20 35 Q 50 50 90 35" stroke="#fecaca" stroke-width="2" fill="none" />
                <path d="M 20 50 Q 50 65 90 50" stroke="#fecaca" stroke-width="2" fill="none" />
                <path d="M 180 35 Q 150 50 110 35" stroke="#fecaca" stroke-width="2" fill="none" />
                <path d="M 180 50 Q 150 65 110 50" stroke="#fecaca" stroke-width="2" fill="none" />
            </svg>
        </div>

        <!-- 3D Alphabet Blocks -->
        <div class="blocks-container blocks-left">
            <div class="block-3d b1">
                <div class="block-face front">A</div>
                <div class="block-face back"></div>
                <div class="block-face right"></div>
                <div class="block-face left"></div>
                <div class="block-face top"></div>
                <div class="block-face bottom"></div>
            </div>
            <div class="block-3d b2">
                <div class="block-face front">B</div>
                <div class="block-face back"></div>
                <div class="block-face right"></div>
                <div class="block-face left"></div>
                <div class="block-face top"></div>
                <div class="block-face bottom"></div>
            </div>
        </div>
        
        <div class="blocks-container blocks-right">
            <div class="block-3d b3">
                <div class="block-face front">C</div>
                <div class="block-face back"></div>
                <div class="block-face right"></div>
                <div class="block-face left"></div>
                <div class="block-face top"></div>
                <div class="block-face bottom"></div>
            </div>
        </div>
    </div>

    <!-- 2. UI Layer -->
    <div class="ui-layer">
        
        <!-- Global Controls -->
        <div class="absolute top-4 right-4 z-50 flex gap-2">
            <button onclick="openSettings()" class="bg-white p-3 rounded-full shadow-lg border-2 border-gray-200 hover:bg-gray-100 transition" title="Settings">
                <!-- Gear Icon -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>

        <!-- HOME SCREEN -->
        <div id="screen-home" class="screen active">
            <h1 class="text-5xl md:text-7xl text-white drop-shadow-[0_5px_5px_rgba(0,0,0,0.3)] mb-2 text-center" style="-webkit-text-stroke: 2px #1e3a8a;">
                Spelling Bee
            </h1>
            <h2 class="text-4xl md:text-5xl text-yellow-300 drop-shadow-[0_4px_4px_rgba(0,0,0,0.3)] mb-12 text-center" style="-webkit-text-stroke: 2px #b45309;">
                Competition
            </h2>
            
            <div class="flex flex-col sm:flex-row gap-6">
                <button class="btn btn-blue" onclick="selectRound(1)">Play Round 1</button>
                <button class="btn btn-green" onclick="selectRound(2)">Play Round 2</button>
            </div>
        </div>

        <!-- START ROUND SCREEN -->
        <div id="screen-start" class="screen">
            <h2 id="start-title" class="text-5xl md:text-6xl text-white mb-8 drop-shadow-lg" style="-webkit-text-stroke: 2px #1e3a8a;">Round 1</h2>
            <p class="text-xl text-white font-bold bg-black bg-opacity-20 px-6 py-3 rounded-full mb-8">
                Pick a number, flip the card, and spell the word!
            </p>
            <div class="flex gap-4">
                <button class="btn" onclick="startGame()">Start Game</button>
                <button class="btn bg-gray-400 border-gray-600" onclick="showScreen('screen-home')" style="box-shadow: 0 8px 0 #4b5563;">Back</button>
            </div>
        </div>

        <!-- GAME SCREEN (Grid View) -->
        <div id="screen-game" class="screen pb-12 pt-4">
            
            <!-- Header area: Title & Controls -->
            <div class="w-full flex justify-between items-start max-w-4xl px-4 mb-4">
                <div class="flex flex-col gap-2">

    <!-- 4. Application Logic -->
    <script>
        // --- Helper for Offline Default Images ---
        function createSvgUrl(bg, text) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#${bg}"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="50" font-family="sans-serif" font-weight="bold" fill="#ffffff">${text}</text></svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        // --- State Management ---
        let state = {
            timerDuration: 30,
            currentRound: 1,
            timer: null,
            timeRemaining: 30,
            activeCardId: null,
            completedCards: { 1: [], 2: [] },
            rounds: {
                1: [
                    { id: 1, word: 'Apple', img: createSvgUrl('ef4444', 'Apple') },
                    { id: 2, word: 'Tree', img: createSvgUrl('22c55e', 'Tree') },
                    { id: 3, word: 'Book', img: createSvgUrl('3b82f6', 'Book') },
                    { id: 4, word: 'Fish', img: createSvgUrl('eab308', 'Fish') },
                    { id: 5, word: 'Bird', img: createSvgUrl('a855f7', 'Bird') },
                    { id: 6, word: 'Star', img: createSvgUrl('64748b', 'Star') }
                ],
                2: [
                    { id: 1, word: 'Elephant', img: createSvgUrl('a3a3a3', 'Elephant') },
                    { id: 2, word: 'Castle', img: createSvgUrl('fca5a5', 'Castle') },
                    { id: 3, word: 'Rocket', img: createSvgUrl('60a5fa', 'Rocket') },
                    { id: 4, word: 'Monkey', img: createSvgUrl('d97706', 'Monkey') },
                    { id: 5, word: 'Banana', img: createSvgUrl('eab308', 'Banana') },
                    { id: 6, word: 'Guitar', img: createSvgUrl('8b5cf6', 'Guitar') }
                ]
            }
        };

        const STORAGE_KEY = 'spellingBeeState';

        // Load saved state from local storage on startup
        function loadFromLocal() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.rounds) {
                        state = parsed;
                        // Reset round completion status on hard reload
                        state.completedCards = { 1: [], 2: [] }; 
                        state.activeCardId = null;
                    }
                } catch(e) {
                    console.error("Failed to load saved state", e);
                }
            }
        }
        
        function saveToLocal() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch(e) {
                console.warn("Could not save to localStorage. Storage might be full due to large images.", e);
                showNotification("Warning: Could not save offline. Images may be too large.", true);
            }
        }

        // Initialize state
        loadFromLocal();

        // Expose internal functions to the Window so the Firebase module can access them
        window.getAppState = () => state;
        window.setAppState = (newState) => { state = newState; };
        window.saveToLocal = saveToLocal;
        window.closeSettings = closeSettings;
        window.showNotification = showNotification;
        window.showScreen = showScreen;

        // --- Navigation ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
            
            // Cleanup on navigation
            stopTimer();
        }

        function selectRound(roundNum) {
            state.currentRound = roundNum;
            document.getElementById('start-title').innerText = `Round ${roundNum}`;
            document.getElementById('game-title').innerText = `Round ${roundNum}`;
            showScreen('screen-start');
        }

        function startGame() {
            renderCards();
            resetTimerDisplay();
            showScreen('screen-game');
        }

        function restartRound() {
            state.completedCards[state.currentRound] = [];
            state.activeCardId = null;
            stopTimer();
            resetTimerDisplay();
            renderCards();
        }

        // --- Game Logic ---
        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            const items = state.rounds[state.currentRound];
            const completed = state.completedCards[state.currentRound] || [];

            items.forEach((item, index) => {
                if (completed.includes(item.id)) return; // Hide chosen cards

                const card = document.createElement('div');
                // Creating a robust front-facing tile for the grid
                card.className = 'w-full aspect-[4/3] bg-gradient-to-br from-yellow-300 to-yellow-500 rounded-xl flex items-center justify-center text-5xl font-heading text-white border-4 border-white shadow-lg cursor-pointer hover:scale-105 transition-transform relative';
                card.style.textShadow = '2px 2px 0 #b45309';
                card.innerHTML = `
                    <div class="absolute inset-2 border-4 border-dashed border-white/50 rounded-lg pointer-events-none"></div>
                    ${index + 1}
                `;

                card.addEventListener('click', () => {
                    openPresentation(item, index + 1);
                });

                container.appendChild(card);
            });
        }

        function openPresentation(item, displayNumber) {
            state.activeCardId = item.id;
            
            // Populate presentation card
            document.getElementById('presentation-front').innerText = displayNumber;
            document.getElementById('presentation-img').src = item.img;
            document.getElementById('presentation-word').innerText = item.word;

            // Reset presentation animations
            document.getElementById('presentation-card').classList.remove('flipped');
            document.getElementById('presentation-word').classList.remove('revealed-word');
            document.getElementById('presentation-timer').style.opacity = '0';
            
            showScreen('screen-presentation');

            // Delay, then flip the card automatically. Once flipped, show timer and start counting.
            setTimeout(() => {
                document.getElementById('presentation-card').classList.add('flipped');
                setTimeout(() => {
                    document.getElementById('presentation-timer').style.opacity = '1';
                    startTimer();
                }, 800); 
            }, 300); 
        }

        function revealPresentationWord() {
            stopTimer();
            document.getElementById('presentation-word').classList.add('revealed-word');
        }

        function backToGrid() {
            stopTimer();
            if (state.activeCardId) {
                // Register card as completed to remove from grid
                if (!state.completedCards[state.currentRound].includes(state.activeCardId)) {
                    state.completedCards[state.currentRound].push(state.activeCardId);
                }
            }
            state.activeCardId = null;
            renderCards();
            showScreen('screen-game');
        }

        // --- Timer Logic ---
        function startTimer() {
            stopTimer(); // Clear existing
            state.timeRemaining = state.timerDuration;
            updateTimerUI();
            
            state.timer = setInterval(() => {
                state.timeRemaining--;
                updateTimerUI();
                
                if (state.timeRemaining <= 0) {
                    stopTimer();
                    // Time's up action
                }
            }, 1000);
        }

        function stopTimer() {
            if (state.timer) {
                clearInterval(state.timer);
                state.timer = null;
            }
        }

        function resetTimerDisplay() {
            state.timeRemaining = state.timerDuration;
            updateTimerUI();
        }

        function updateTimerUI() {
            const display = document.getElementById('presentation-timer');
            display.innerText = state.timeRemaining;
            
            if (state.timeRemaining <= 5 && state.timeRemaining > 0) {
                display.classList.add('low');
            } else {
                display.classList.remove('low');
            }
        }

        // --- Settings Logic ---
        let tempSettingsRounds = { 1: [], 2: [] };

        function openSettings() {
            document.getElementById('settings-modal').classList.add('active');
            document.getElementById('setting-timer').value = state.timerDuration;
            
            // Create a temporary state for editing settings
            tempSettingsRounds = JSON.parse(JSON.stringify(state.rounds));
            
            renderSettingsForm(1);
            renderSettingsForm(2);
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function syncInputsToTemp(roundNum) {
            tempSettingsRounds[roundNum].forEach((item, index) => {
                const wordInput = document.getElementById(`temp-r${roundNum}-w${index}`);
                const imgInput = document.getElementById(`temp-r${roundNum}-i${index}`);
                if (wordInput) item.word = wordInput.value;
                if (imgInput) item.img = imgInput.value;
            });
        }

        function deleteCard(roundNum, index) {
            syncInputsToTemp(roundNum);
            tempSettingsRounds[roundNum].splice(index, 1);
            renderSettingsForm(roundNum);
        }

        function addCard(roundNum) {
            syncInputsToTemp(roundNum);
            const newId = Date.now() + Math.floor(Math.random() * 1000);
            tempSettingsRounds[roundNum].push({
                id: newId,
                word: 'New Word',
                img: createSvgUrl('9ca3af', 'New')
            });
            renderSettingsForm(roundNum);
        }

        function renderSettingsForm(roundNum) {
            const containerId = roundNum === 1 ? 'settings-r1' : 'settings-r2';
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            tempSettingsRounds[roundNum].forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'mb-4 p-3 bg-white rounded-lg shadow-sm border border-gray-100';
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <div class="font-bold text-gray-500 text-sm">Card ${index + 1}</div>
                        <button onclick="deleteCard(${roundNum}, ${index})" class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1 bg-red-50 rounded transition">Delete</button>
                    </div>
                    <div class="input-group">
                        <label class="text-sm">Spelling Word</label>
                        <input type="text" id="temp-r${roundNum}-w${index}" value="${item.word}" class="text-sm">
                    </div>
                    <div class="input-group">
                        <label class="text-sm">Image (URL or Upload)</label>
                        <div class="flex gap-2">
                            <input type="text" id="temp-r${roundNum}-i${index}" value="${item.img}" class="text-sm flex-1">
                            <button type="button" onclick="openFileSelector(${roundNum}, ${index})" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded hover:bg-indigo-200 transition text-sm font-bold shadow-sm whitespace-nowrap border border-indigo-200">
                                📁 Upload
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });

            // Add new card button
            const addBtn = document.createElement('button');
            addBtn.className = 'mt-2 w-full py-2 bg-blue-100 text-blue-700 font-bold rounded hover:bg-blue-200 transition text-sm';
            addBtn.innerText = '+ Add Card';
            addBtn.onclick = () => addCard(roundNum);
            container.appendChild(addBtn);
        }

        function saveSettings() {
            // Update Timer
            const newTimer = parseInt(document.getElementById('setting-timer').value);
            if (!isNaN(newTimer) && newTimer > 0) {
                state.timerDuration = newTimer;
            }

            // Sync whatever was typed immediately before saving
            syncInputsToTemp(1);
            syncInputsToTemp(2);
            
            // Assign temporary state back to main game state
            state.rounds = JSON.parse(JSON.stringify(tempSettingsRounds));

            saveToLocal();
            closeSettings();
            showNotification("Settings Saved!");
            
            // If currently in game, re-render to apply changes immediately
            if (document.getElementById('screen-game').classList.contains('active')) {
                restartRound();
            }
        }

        function showNotification(msg = "Settings Saved!", isError = false) {
            const notif = document.getElementById('notification');
            notif.innerText = msg;
            notif.style.background = isError ? '#ef4444' : '#10b981';
            notif.classList.add('show');
            setTimeout(() => {
                notif.classList.remove('show');
            }, 3000);
        }

        // --- Image Upload Logic ---
        let currentUploadTarget = null;

        function openFileSelector(roundNum, index) {
            currentUploadTarget = { roundNum, index };
            document.getElementById('global-file-upload').click();
        }

        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (!file || !currentUploadTarget) return;

            // Use FileReader to convert image to a Base64 string so it can be saved offline and exported
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                
                const { roundNum, index } = currentUploadTarget;
                const inputField = document.getElementById(`temp-r${roundNum}-i${index}`);
                if (inputField) {
                    inputField.value = imageUrl;
                    tempSettingsRounds[roundNum][index].img = imageUrl; 
                }
                
                event.target.value = '';
                currentUploadTarget = null;
            };
            
            // Read as Data URL (Base64) instead of object URL
            reader.readAsDataURL(file);
        }

        // --- Export / Import Logic ---
        function exportData() {
            // Remove temporary state variables before exporting
            const exportState = JSON.parse(JSON.stringify(state));
            exportState.completedCards = { 1: [], 2: [] };
            exportState.activeCardId = null;
            exportState.timeRemaining = exportState.timerDuration;
            exportState.timer = null;

            const dataStr = JSON.stringify(exportState);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'spelling-bee-config.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function triggerImport() {
            document.getElementById('import-file-upload').click();
        }

        function handleImportSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (importedState && importedState.rounds) {
                        state = importedState;
                        saveToLocal();
                        closeSettings();
                        showNotification("Data Imported successfully!");
                        // Send user to home screen to ensure clear state
                        showScreen('screen-home');
                    } else {
                        showNotification("Error: Invalid configuration file.", true);
                    }
                } catch (err) {
                    showNotification("Error parsing file.", true);
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        // --- PWA & Offline Support ---
        (function initOfflineSupport() {
            // 1. Generate and inject Manifest (Allows 'Add to Home Screen')
            const manifest = {
                name: "Spelling Bee Competition",
                short_name: "SpellingBee",
                start_url: window.location.href,
                display: "standalone",
                background_color: "#60a5fa",
                theme_color: "#60a5fa",
                icons: [{
                    src: "data:image/svg+xml;charset=utf-8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#f59e0b' rx='20'/><text x='50' y='55' font-size='50' text-anchor='middle' dominant-baseline='middle'>🐝</text></svg>"),
                    sizes: "192x192",
                    type: "image/svg+xml"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

            // 2. Inline Service Worker for asset caching (Allows offline reloads)
            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'spell-bee-v1';
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                    self.addEventListener('fetch', e => {
                        if (e.request.method !== 'GET') return;
                        e.respondWith(
                            caches.match(e.request).then(cached => {
                                const networked = fetch(e.request).then(response => {
                                    const cacheCopy = response.clone();
                                    caches.open(CACHE_NAME).then(cache => cache.put(e.request, cacheCopy));
                                    return response;
                                }).catch(() => cached);
                                return cached || networked;
                            })
                        );
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                // We use URL.createObjectURL to register the worker from our single file
                navigator.serviceWorker.register(URL.createObjectURL(swBlob))
                    .then(() => console.log('Offline support ready (Service Worker registered).'))
                    .catch(err => console.log('Offline support warning:', err));
            }
        })();

    </script>

                exportState.completedCards = { 1: [], 2: [] };
                exportState.activeCardId = null;
                exportState.timeRemaining = exportState.timerDuration;
                exportState.timer = null;

                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'spelling_bee_configs', code);
                await setDoc(docRef, { 
                    config: JSON.stringify(exportState), 
                    createdAt: new Date().toISOString() 
                });
                
                const display = document.getElementById('cloud-code-display');
                display.innerText = code;
                display.classList.remove('hidden');
                
                window.showNotification(`Saved to Cloud! Share code: ${code}`);
            } catch (e) {
                console.error(e);
                window.showNotification("Error saving to cloud. Image sizes may be too large.", true);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };

        window.loadFromCloud = async (btn) => {
            const originalText = btn.innerText;
            try {
                const codeInput = document.getElementById('cloud-load-code');
                const code = codeInput.value.trim().toUpperCase();
                if (!code) {
                    window.showNotification("Please enter a code.", true);
                    return;
                }

                btn.innerText = "Loading...";
                btn.disabled = true;
                await ensureAuth();

                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'spelling_bee_configs', code);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const importedState = JSON.parse(docSnap.data().config);
                    if (importedState && importedState.rounds) {
                        window.setAppState(importedState);
                        window.saveToLocal();
                        window.closeSettings();
                        window.showNotification("Cloud data loaded successfully!");
                        window.showScreen('screen-home');
                    }
                } else {
                    window.showNotification("Code not found. Please check and try again.", true);
                }
            } catch (e) {
                console.error(e);
                window.showNotification("Error loading from cloud.", true);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
